# Reverse proxy (CTN-01) and static host of the Web SPA (CTN-02). The only published port.
server {
  listen 80;
  client_max_body_size 1m;
  location /api/ {
    proxy_pass http://api:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location /__test/ {
    proxy_pass http://api:8080;   # answers only when APP_PROFILE=test (CNV-10)
  }
  location / {
    root /usr/share/nginx/html;
    try_files $uri /index.html;   # SPA routes are client-side
  }
}
