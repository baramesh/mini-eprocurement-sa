      - title: การแบ่งโมดูลของ API
        render: table
        caption: โมดูลของ API service
        pieces: [04-arch-desc/components]
        columns: [{ title: โมดูล, field: title }, { title: หน้าที่, field: body }, { title: FR, field: frs }, { title: API operation, field: operations }]
      - { title: มุมมองขณะทำงาน (Runtime View), render: figure, pieces: ["04-arch-desc/views/v-0[34]-*"] }
      - title: การติดตั้ง
        children:
          - { title: แผนภาพการติดตั้ง, render: figure, pieces: ["04-arch-desc/views/v-05-*"] }
          - title: สภาพแวดล้อม
            render: table
            caption: สภาพแวดล้อมของระบบ
            pieces: [04-arch-desc/environments]
            columns: [{ title: สภาพแวดล้อม, field: title }, { title: วัตถุประสงค์, field: purpose }, { title: ข้อมูล, field: data }, { title: ผู้ใช้งาน, field: access }]
      - title: ความมั่นคงปลอดภัย
        children:
          - { title: ขอบเขตความเชื่อถือ, render: figure, pieces: [08-security-arch/views] }
          - { title: มาตรการหลัก, render: items, pieces: [08-security-arch/controls], heading: "{title}" }
          - title: การเทียบกับ OWASP Top 10
            render: table
            caption: ความเสี่ยงตาม OWASP และมาตรการ
            pieces: [08-security-arch/owasp]
            columns: [{ title: ความเสี่ยง, field: title }, { title: มาตรการ, field: control }, { title: กรณีทดสอบที่รองรับ, field: evidence }]
      - title: คุณลักษณะคุณภาพและมาตรการเชิงสถาปัตยกรรม
        render: table
        caption: คุณลักษณะคุณภาพและมาตรการ
        pieces: [04-arch-desc/quality]
        columns: [{ title: NFR, field: nfr }, { title: ข้อกำหนด, field: title }, { title: มาตรการ, field: body }, { title: ตรวจด้วย, field: verified_by }]
      - { title: การตัดสินใจเชิงสถาปัตยกรรม, render: items, pieces: [04-arch-desc/decisions], heading: "{id} {title} ({status})" }
